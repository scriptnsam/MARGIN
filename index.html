["History","The Library of Alexandria","Founded in Egypt under the Ptolemies around the 3rd century BCE, it aimed to gather the world’s writings. Its decline was slow: funding cuts, politics and neglect over centuries mattered more than any single fire.","How did the library mostly decline?",["In one great fire","Gradually, over centuries","In an earthquake"],1],
["History","Mansa Musa’s pilgrimage","Mansa Musa ruled the Mali Empire, rich in gold and salt trade. His 1324 pilgrimage to Mecca, with an enormous caravan, spread so much gold around Cairo that prices there were disrupted for years.","Which empire did Mansa Musa rule?",["Songhai","Mali","Ghana"],1],
["History","Movable type in Europe","Around 1440, Johannes Gutenberg of Mainz developed a printing system using movable metal type. Books became cheaper and faster to make, which helped new ideas travel across Europe.","Who developed European movable type?",["Gutenberg","Galileo","Newton"],0],
["History","The Rosetta Stone","Found in 1799, this slab carries one decree written in hieroglyphs, Demotic and Greek. Because scholars could read the Greek, Jean-François Champollion was able to decipher hieroglyphs in 1822.","Which language helped decode hieroglyphs?",["Latin","Greek","Arabic"],1],

"The Library of Alexandria":["The Library of Alexandria was the greatest research institution of the ancient Mediterranean, part of a scholarly complex called the Mouseion. Founded under the Ptolemaic rulers of Egypt in the 3rd century BCE, it collected scrolls on literature, mathematics, astronomy and medicine, perhaps hundreds of thousands in all.","The Ptolemies wanted prestige and power, and knowledge was both. Ships entering the harbour were reputedly searched so their books could be copied. The library drew scholars such as Eratosthenes, who served as its head and calculated Earth’s circumference.","Scribes copied texts by hand while scholars edited and catalogued them, which shaped how ancient works were preserved. Its end was gradual: royal funding shrank, Julius Caesar’s siege in 48 BCE damaged part of the city’s holdings, and later conflicts and neglect finished the job over centuries."],
"Movable type in Europe":["Movable type is a printing method where each letter is a separate metal piece that can be arranged into words, inked, pressed onto paper, then rearranged for the next page. Johannes Gutenberg developed a workable European system in Mainz around 1440.","Before it, every book was copied by hand, which took months and made books expensive. Printing cut cost and time dramatically, so more people could own books, read for themselves and compare ideas. It helped fuel the Renaissance, the Reformation and the growth of science.","Gutenberg combined several things: a metal alloy that cast durable letters, an oil-based ink that stuck to metal, and a press adapted from those used for wine and olives. Typesetters assembled lines of letters in a frame, a pressman inked them and pressed the paper, and the same letters were reused. His 42-line Bible of the 1450s is the famous result."],
"Who makes our oxygen?":["Photosynthesis is how plants, algae and some bacteria turn light, water and carbon dioxide into sugar for energy, releasing oxygen as a by-product. Phytoplankton, microscopic drifting organisms in the sea, do an enormous share of it.","Ocean photosynthesis is often estimated to account for about half of the oxygen produced each year, though much of it is used up again by living things. The oxygen we breathe built up over billions of years, starting when early cyanobacteria began photosynthesising. Phytoplankton also feed marine food webs and absorb carbon dioxide.","Inside chloroplasts, chlorophyll absorbs light and uses its energy to split water molecules. That releases oxygen and powers reactions that build sugar from carbon dioxide. Tiny floating cells do this near the sunlit ocean surface, which is why ocean health matters for the planet’s air and climate."],
"Why the sky is blue":["The sky looks blue because of Rayleigh scattering: gas molecules in the atmosphere scatter sunlight, and they scatter short wavelengths such as blue far more strongly than long wavelengths such as red.","Sunlight looks white but contains every colour. If air did not scatter light, the sky would look black with a bright Sun, as it does on the Moon. Scattering is also why daylight reaches into shade.","Scattering strength rises steeply as wavelength gets shorter, so blue light is bounced around in all directions and reaches your eyes from everywhere you look. Violet scatters even more, but the Sun emits less of it, the upper atmosphere absorbs some, and our eyes are less sensitive to it. At sunset, light crosses more air, the blue scatters away along the path, and reds and oranges remain."],
"The Four Noble Truths":["The Four Noble Truths are the foundation of Buddhist teaching, traditionally given by the Buddha, Siddhartha Gautama, in his first sermon. They are: dukkha (suffering or unsatisfactoriness) exists; it has a cause; it can end; and there is a path to its end.","They frame Buddhism as a practical response to a human problem rather than a set of abstract claims. The cause is usually described as craving and attachment, and the ending of suffering is called nirvana. Traditions interpret details differently, but this structure is shared across Theravada, Mahayana and Vajrayana schools.","The fourth truth gives the method: the Noble Eightfold Path, grouped into wisdom (right view and intention), ethical conduct (right speech, action and livelihood) and mental discipline (right effort, mindfulness and concentration). Practice combines ethics, meditation and study, often within a teacher’s guidance or a community."],
"The Five Pillars of Islam":["The Five Pillars are the core acts of worship in Islam: shahada (declaring faith in one God and Muhammad as His messenger), salat (five daily prayers), zakat (obligatory charity), sawm (fasting during Ramadan) and hajj (pilgrimage to Mecca).","For Muslims they give faith a visible, shared structure that links belief with discipline, gratitude and community. Zakat addresses care for the poor, fasting builds self-restraint and empathy, and hajj gathers Muslims from across the world in common rites.","Prayer is performed at set times of day facing the Kaaba in Mecca, after ritual washing. Zakat is commonly calculated as 2.5% of qualifying savings each year. Fasting means abstaining from food and drink from dawn to sunset through Ramadan, with exemptions for illness, travel and others. Hajj is required once in a lifetime for those who are physically and financially able."],
"The Stoic dial":["Stoicism is an ancient Greek and Roman philosophy founded by Zeno of Citium around 300 BCE. Its central idea, the dichotomy of control, is that some things are up to us, such as our judgements, choices and actions, and others are not, such as other people’s opinions, health or luck.","Stoics argued that distress comes largely from how we judge events, not from the events alone. Directing effort at what we control brings steadiness. Marcus Aurelius, an emperor, and Epictetus, a former slave, both used it to face hardship and responsibility.","Practices include pausing to ask “is this up to me?”, imagining setbacks in advance, reviewing your day each evening, and acting with virtue (wisdom, courage, justice and self-control) whatever the outcome. It doesn’t mean suppressing feeling; it means choosing your response deliberately."],
"Socrates wrote nothing":["Socrates (c. 470–399 BCE) was an Athenian philosopher who left no writings. Our picture of him comes mainly from Plato’s dialogues, along with Xenophon and the playwright Aristophanes, whose accounts do not always agree.","He shifted philosophy toward how people should live. He claimed to know only that he knew little, and showed that confident beliefs about justice or courage often fall apart under questioning. Athens tried him in 399 BCE for impiety and corrupting the young, and he was sentenced to death.","His method, the elenchus, is a conversation: he asks for a definition, tests it with examples and counter-examples, exposes contradictions, and invites a better definition. It still shapes teaching and critical thinking. Try it yourself: take one of your beliefs, ask “what exactly do I mean?”, and look for a case that breaks it."],
"A river that flows north":["The Nile is about 6,650 km long and flows north to the Mediterranean through a basin shared by eleven countries. Its two main branches are the White Nile, from the Great Lakes region, and the Blue Nile, from Ethiopia’s highlands. They meet at Khartoum in Sudan.","In Egypt, where rain is scarce, the river made farming possible. The Blue Nile’s summer floods carried silt that renewed the soil, so ancient Egyptians built their calendar, taxes and religion around the flood. Today it supplies water and power to millions across the region.","It flows north because the land slopes that way: its sources lie at higher elevation in the south. The Aswan High Dam, completed in 1970, now controls the flood, storing water and producing electricity, though it also traps silt. Sharing the water, including around Ethiopia’s Grand Renaissance Dam, remains a major diplomatic issue."],
"The green Sahara":["The African Humid Period was a time, from roughly 14,500 to 5,000 years ago, when the Sahara had grasslands, lakes and rivers. Rock paintings and fossils show hippos, crocodiles, cattle herders and fishers living where there is now sand.","It shows that climate can change dramatically within human history. When the rains faded, people moved toward the Nile Valley and other water sources, which many researchers link to the rise of early Egyptian civilisation. It also warns that regional climates can shift faster than we expect.","Slow wobbles in Earth’s axis changed how much summer sunlight the Northern Hemisphere received, strengthening the African monsoon and pushing rain far north. As that effect weakened, the monsoon retreated south, and the loss of vegetation reduced moisture further, speeding the return to desert."]

["Chinese verbs never change form. Add 吗 (ma) to the end of a statement to make a yes/no question: 你好 becomes 你好吗？ To give your name, say 我叫 plus the name.","To order, say 我要 (wǒ yào, I want) or the softer 我想 (wǒ xiǎng, I’d like). 不要 (bú yào) means “don’t want”, which is how you say “no spicy”: 不要辣.","Directions are short commands: 左转 and 右转 for turns, 一直走 for straight. Use 在哪里 (zài nǎlǐ) for “where is…?”, and 吗 for yes/no questions like 远吗？","Numbers 1 to 10 unlock prices: 十一 is 11, 二十 is 20 and 五十 is 50. The everyday word for yuan is 块 (kuài).","Ask 你会…吗 (nǐ huì … ma) to find out if someone can do something. Put 在 (zài) before a verb for an ongoing action: 我在学中文 means “I’m learning Chinese”."].forEach(function(g,i){LGD.zh.units[i].g=g});
["Korean has polite speech built in. The -요 and -습니다 endings are safe with strangers and elders. Verbs go at the end of the sentence.","Add 주세요 (juseyo, “please give me”) after what you want: 물 주세요 is “water, please”. 이거 (igeo) means “this”.","Put the place before 어디예요 (eodiyeyo, “where is”): 지하철역이 어디예요? Directions such as 직진하세요 end in -세요, a polite command.","Prices use Sino-Korean numbers plus 원 (won): 오천 원 is 5,000 won. 얼마예요 asks “how much?”","에서 (eseo) after a place means “from”: 캐나다에서 왔어요 is “I came from Canada”. -고 있어요 shows an ongoing action, as in “I’m studying”."].forEach(function(g,i){LGD.ko.units[i].g=g});

{t:"Time and days",tip:"Chinese puts time words before the verb. Days of the week are numbered: Monday is 星期一, literally “week one”.",g:"Say the time with 点 (diǎn): 三点 is 3 o’clock, and 半 (bàn) means half past: 三点半. Days are 星期 plus a number, from 星期一 to 星期六. Sunday is 星期天.",
